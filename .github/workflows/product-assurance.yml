name: Product assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 2'
  workflow_dispatch:
    inputs:
      load_profile:
        description: k6 profile (smoke, average, stress, spike, or soak)
        required: false
        default: smoke

concurrency:
  group: product-assurance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      run_assurance: ${{ steps.scope.outputs.run_assurance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine assurance scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/product_assurance_gate.py scope

  local-controls:
    needs: scope
    if: needs.scope.outputs.run_assurance == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.14'
      - name: Validate locally observable assurance controls
        run: >-
          python tools/check_product_assurance.py
          --output evidence/product-assurance.json
          --junit evidence/junit-product-assurance.xml
      - name: Upload local assurance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Perdura-product-assurance-local-${{ github.sha }}
          path: evidence
          retention-days: 90

  dependency-review:
    needs: scope
    if: needs.scope.outputs.run_assurance == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  osv:
    needs: scope
    if: needs.scope.outputs.run_assurance == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --recursive
        ./
      results-file-name: perdura-osv.sarif
      fail-on-vuln: true
      upload-sarif: true

  scorecard:
    needs: scope
    if: needs.scope.outputs.run_assurance == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate machine-readable OpenSSF Scorecard results
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      - name: Generate Scorecard SARIF
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Publish Scorecard code-scanning evidence
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: scorecard.sarif
      - name: Retain raw Scorecard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Perdura-scorecard-${{ github.sha }}
          path: |
            scorecard.json
            scorecard.sarif
          retention-days: 90

  candidate-scorecard:
    needs: scope
    if: needs.scope.outputs.run_assurance == 'true' && github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Assess candidate files and default-branch repository governance
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/run_candidate_scorecard.py --repository "$GITHUB_REPOSITORY"
          --candidate-root . --output-dir evidence/scorecard
      - name: Publish manual candidate Scorecard evidence
        if: always() && hashFiles('evidence/scorecard/upload/candidate-local.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: evidence/scorecard/upload/candidate-local.sarif
          category: scorecard-candidate-local
      - name: Publish separately scoped repository Scorecard evidence
        if: always() && hashFiles('evidence/scorecard/upload/repository-default.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: evidence/scorecard/upload/repository-default.sarif
          category: scorecard-repository-default
      - name: Retain both Scorecard scopes and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Perdura-candidate-scorecard-${{ github.sha }}
          path: evidence/scorecard
          retention-days: 90

  container:
    needs: scope
    if: needs.scope.outputs.run_assurance == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the exact reference deployment image
        id: build-container
        run: docker build --build-arg APP_VERSION=assurance -t perdura:assurance .
      - name: Verify the final-user production runtime
        run: >-
          python3 tools/check_container_runtime.py --image perdura:assurance
          --target '${{ matrix.target }}' --output-dir evidence/container
      - name: Scan image vulnerabilities and configuration
        if: always() && steps.build-container.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: perdura:assurance
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,misconfig,secret
          # SARIF otherwise includes every severity and makes exit-code gate on
          # findings outside the HIGH/CRITICAL assurance policy.
          limit-severities-for-sarif: true
          exit-code: '1'
          version: v0.70.0
      - name: Record the complete image SBOM
        if: always() && steps.build-container.outcome == 'success'
        run: |
          mkdir -p evidence/container
          trivy image --format cyclonedx --output evidence/container/sbom.cdx.json perdura:assurance
      - name: Publish Trivy code-scanning evidence
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: container-${{ matrix.target }}
      - name: Retain raw container evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Perdura-container-assurance-${{ matrix.target }}-${{ github.sha }}
          path: |
            trivy.sarif
            evidence/container
          retention-days: 90

  browser-compatibility:
    needs: scope
    if: needs.scope.outputs.run_assurance == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Install the candidate and browser engine
        run: |
          uv sync --locked --python 3.13.14 --extra app --group dev
          npm ci --prefix gui/frontend
          npx --prefix gui/frontend playwright install --with-deps '${{ matrix.browser }}'
          npm run build --prefix gui/frontend
      - name: Start the isolated candidate
        run: |
          mkdir -p evidence/browser
          cd gui/backend
          nohup uv run --no-sync uvicorn main:app --host 127.0.0.1 --port 8000 > ../../evidence/browser/server.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat ../../evidence/browser/server.log
          exit 1
      - name: Verify every workspace with the selected browser
        run: >-
          npm run assurance:browser --prefix gui/frontend --
          --browser '${{ matrix.browser }}' --base-url http://127.0.0.1:8000
          --output ../../evidence/browser/browser-assurance.json
          --junit ../../evidence/browser/junit-browser-assurance.xml
      - name: Retain browser compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Perdura-browser-${{ matrix.browser }}-${{ github.sha }}
          path: evidence/browser
          retention-days: 90

  dynamic-and-performance:
    needs: scope
    if: needs.scope.outputs.run_assurance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Install locked application and browser dependencies
        run: |
          uv sync --locked --python 3.13.14 --extra app --group dev
          npm ci --prefix gui/frontend
          npx --prefix gui/frontend playwright install --with-deps chromium
          npm run build --prefix gui/frontend
      - name: Start the isolated full-stack application
        shell: bash
        run: |
          mkdir -p evidence/dynamic
          cd gui/backend
          nohup uv run --no-sync uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log > ../../evidence/dynamic/server.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat ../../evidence/dynamic/server.log
          exit 1
      - name: Run axe browser journeys
        run: >-
          npm run assurance:browser --prefix gui/frontend --
          --base-url http://127.0.0.1:8000
          --output ../../evidence/dynamic/browser-assurance.json
          --junit ../../evidence/dynamic/junit-browser-assurance.xml
      - name: Verify Plotly rendering and downloaded exports
        run: >-
          npm run assurance:plotly --prefix gui/frontend --
          --base-url http://127.0.0.1:8000
          --output-dir ../../evidence/dynamic/plotly
      - name: Verify Plotly migration and provenance-aware exports
        run: >-
          npm run assurance:plotly-migration --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/plotly-migration
      - name: Verify prediction mission result invalidation
        run: >-
          npm run assurance:prediction --prefix gui/frontend --
          --base-url http://127.0.0.1:8000
      - name: Verify closed-panel work and Plotly update contracts
        run: >-
          npm run assurance:performance --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/frontend-performance
      - name: Verify shared controls and accessible chart data
        run: >-
          npm run assurance:shared-ui --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/shared-ui
      - name: Verify step-stress input and result semantics
        run: >-
          npm run assurance:step-stress --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/step-stress
      - name: Verify FTA library hierarchy, editing, and accessibility
        run: >-
          npm run assurance:fta-library --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/fta-library
      - name: Verify FTA report diagrams and export provenance
        run: >-
          npm run assurance:fta-library-reports --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/fta-library-reports
      - name: Verify adopted LDA distributions, SSI and Monte Carlo workflows
        env:
          PERDURA_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: >-
          npm run assurance:adopted-distribution --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/adopted-distribution
      - name: Verify live distribution inputs across reliability consumers
        env:
          PERDURA_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: >-
          npm run assurance:reliability-sources --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/reliability-sources
      - name: Verify shared System Definition and Prediction scenarios
        run: >-
          npm run assurance:shared-system --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/shared-system
      - name: Verify deterministic layouts across all diagram canvases
        run: >-
          npm run assurance:diagram-layout --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/diagram-layout
      - name: Verify full-screen diagram editing and keyboard behavior
        run: >-
          npm run assurance:diagram-fullscreen --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/diagram-fullscreen
      - name: Verify project format isolation and incremental browser persistence
        run: >-
          npm run assurance:project-persistence --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/project-persistence
      - name: Verify startup recovery with blank and file projects
        run: >-
          npm run assurance:startup-recovery --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/startup-recovery
      - name: Verify display preferences and distribution labels
        run: >-
          npm run assurance:display-preferences --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/display-preferences
      - name: Verify the bundled aircraft example and L4 diagram navigation
        run: >-
          npm run assurance:aircraft-example --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/aircraft-example
      - name: Verify popup dismissal and simplified project units
        run: >-
          npm run assurance:popover-menus --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/popover-menus
      - name: Verify RBD library navigation and linked analyses
        run: >-
          npm run assurance:rbd-library --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/rbd-library
      - name: Verify Life Data placeholder rows and keyboard editing
        run: >-
          npm run assurance:life-data-entry --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/life-data-entry
      - name: Verify Interfaces canvas editing and inspector controls
        run: >-
          npm run assurance:system-interfaces --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/system-interfaces
      - name: Verify hierarchy visibility and interface display filters
        run: >-
          npm run assurance:interface-visibility --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/interface-visibility
      - name: Verify live FMEA system editing and calculation inputs
        run: >-
          npm run assurance:shared-fmea --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/shared-fmea
      - name: Verify focused FMEA interfaces and accessible diagram navigation
        run: >-
          npm run assurance:shared-fmea-diagram --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/shared-fmea-diagram
      - name: Verify portable FMEA system bindings and engineering freshness
        run: >-
          npm run assurance:shared-fmea-persistence --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/shared-fmea-persistence
      - name: Verify structured functions and explicit resource transfers
        run: >-
          npm run assurance:simplified-functions --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/simplified-functions
      - name: Verify input selection and collapsed supplier dependencies
        run: >-
          npm run assurance:inherited-inputs --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/inherited-inputs
      - name: Verify process external terminals and complementary functions
        run: >-
          npm run assurance:process-transfer-authoring --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/process-transfer-authoring
      - name: Verify canonical FMEA prerequisites and read-only invalidation
        run: >-
          npm run assurance:canonical-fmea-workflow --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/canonical-fmea-workflow
      - name: Verify FMEA readiness and controlled lifecycle against backend handlers
        run: >-
          npm run assurance:fmea-readiness --prefix gui/frontend --
          --output-dir ../../evidence/dynamic/fmea-readiness
      - name: Run Lighthouse laboratory profile
        shell: bash
        run: |
          export CHROME_PATH="$(cd gui/frontend && node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          gui/frontend/node_modules/.bin/lighthouse http://127.0.0.1:8000/?perduraShowcase=1 \
            --quiet --preset=desktop --only-categories=performance,accessibility,best-practices \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --output=json --output-path=evidence/dynamic/lighthouse.json
          npm run assurance:lighthouse-summary --prefix gui/frontend -- \
            --input ../../evidence/dynamic/lighthouse.json \
            --output ../../evidence/dynamic/lighthouse-summary.json \
            --junit ../../evidence/dynamic/junit-lighthouse.xml
      - name: Install k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
        with:
          # setup-k6-action adds the release tag's `v` prefix itself.
          k6-version: '2.1.0'
      - name: Run API performance profile
        env:
          PROFILE: ${{ github.event.inputs.load_profile || 'smoke' }}
          BASE_URL: http://127.0.0.1:8000
        run: k6 run --summary-export evidence/dynamic/k6-summary.json assurance/k6/perdura-api.js
      - name: Run OWASP ZAP passive browser scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8000
          allow_issue_writing: false
          fail_action: true
          artifact_name: Perdura-ZAP-baseline-${{ github.sha }}
          rules_file_name: assurance/zap-rules.tsv
          cmd_options: '-a -j'
      - name: Prepare API scan evidence output
        if: github.event_name != 'pull_request'
        # The Docker action runs as ZAP's unprivileged user, not the runner.
        # Permit writes only in its dedicated evidence leaf. The hook proves
        # writability as that actual user before importing or scanning the API.
        run: install -d -m 1777 evidence/dynamic/zap-api
      - name: Run OWASP ZAP active OpenAPI scan
        if: github.event_name != 'pull_request'
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: http://127.0.0.1:8000/api/v1/openapi.json
          format: openapi
          allow_issue_writing: false
          fail_action: true
          artifact_name: Perdura-ZAP-api-${{ github.sha }}
          rules_file_name: assurance/zap-rules.tsv
          # -T bounds startup/passive processing only. Explicit scanner limits
          # keep the active scan inside this job's 60-minute budget.
          cmd_options: '-T 10 -n assurance/zap-api.context --hook /zap/wrk/assurance/zap_api_hooks.py -z "-config scanner.maxScanDurationInMins=30 -config scanner.maxRuleDurationInMins=5"'
      - name: Retain browser and performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Perdura-dynamic-performance-${{ github.sha }}
          path: evidence/dynamic
          retention-days: 90

  assurance-gate:
    name: Product assurance gate
    if: always()
    needs: [scope, local-controls, dependency-review, osv, scorecard, candidate-scorecard, container, browser-compatibility, dynamic-and-performance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Locate original assurance failures
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --paginate --slurp
          'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100'
          > assurance-jobs.json
      - name: Require successful assurance results
        env:
          ASSURANCE_NEEDS: ${{ toJSON(needs) }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          SCORECARD_MANUAL_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          ASSURANCE_JOBS_FILE: ${{ hashFiles('assurance-jobs.json') != '' && 'assurance-jobs.json' || '' }}
        run: python3 tools/product_assurance_gate.py check
