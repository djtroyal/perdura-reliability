name: Build & Release

on:
  push:
    tags:
      - 'v*'           # Trigger on version tags: v0.1.0, v1.0.0, etc.
  workflow_dispatch:     # Manual trigger from the Actions tab
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  crow-assurance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve assurance artifact name
        id: assurance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then REF="$DISPATCH_TAG"; else REF="$REF_NAME"; fi
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable vX.Y.Z form; got: $REF" >&2
            exit 1
          fi
          echo "file=Perdura-${REF#v}-crow-amsaa-validation.json" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install uv-managed Python 3.11.15
        run: uv python install 3.11.15

      - name: Install locked scientific dependencies
        run: uv sync --locked --managed-python --python '3.11.15' --no-dev

      - name: Validate assurance inventory structure
        run: uv run --no-sync python tools/check_model_assurance.py

      - name: Run certification-eligible Crow-AMSAA validation
        run: uv run --no-sync python tools/crow_amsaa_validation.py --profile release --output '${{ steps.assurance.outputs.file }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Perdura-Crow-AMSAA-validation-${{ steps.assurance.outputs.version }}
          path: ${{ steps.assurance.outputs.file }}
          retention-days: 30

  build:
    needs: [test, crow-assurance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            artifact: Perdura-linux
            archive_cmd: tar -czf

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download consolidated CI verification report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-CI-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ci-evidence

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.29'
          enable-cache: false

      - name: Install uv-managed Python 3.11.15
        run: uv python install 3.11.15

      # ── Resolve the release version from the tag (or dispatch input) and
      #    require source/package metadata to match it exactly ─────────────
      - name: Resolve version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REF="$DISPATCH_TAG"
          else
            REF="$REF_NAME"
          fi
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable vX.Y.Z form; got: $REF" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$REF^{commit}" >/dev/null; then
            TAG_COMMIT="$(git rev-parse "refs/tags/$REF^{commit}")"
            BUILD_COMMIT="$(git rev-parse HEAD)"
            if [ "$TAG_COMMIT" != "$BUILD_COMMIT" ]; then
              echo "Existing tag $REF does not identify the commit being built." >&2
              exit 1
            fi
          fi
          VERSION="${REF#v}"
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release commit must be contained in main." >&2
            exit 1
          fi
          uv run --no-project --managed-python --python 3.11.15 python tools/check_version_consistency.py --expected "${VERSION}"
          BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          VERIFY_SHA="$(python -c 'import hashlib, pathlib; print(hashlib.sha256(pathlib.Path("ci-evidence/verification-report.json").read_bytes()).hexdigest())')"
          VERIFY_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python tools/stamp_build.py --commit "$(git rev-parse HEAD)" --timestamp "$BUILD_TIMESTAMP" --verification-report-sha256 "$VERIFY_SHA" --verification-run-url "$VERIFY_URL"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "verification_sha256=${VERIFY_SHA}" >> "$GITHUB_OUTPUT"
          echo "verification_run_url=${VERIFY_URL}" >> "$GITHUB_OUTPUT"
          echo "manifest=Perdura-${VERSION}-dependencies-${{ matrix.target }}.json" >> "$GITHUB_OUTPUT"
          echo "cyclonedx=Perdura-${VERSION}-sbom-${{ matrix.target }}.cdx.json" >> "$GITHUB_OUTPUT"
          echo "spdx=Perdura-${VERSION}-sbom-${{ matrix.target }}.spdx.json" >> "$GITHUB_OUTPUT"
          echo "archive=Perdura-${VERSION}-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "Building Perdura ${VERSION}"

      # ── Node (build frontend) ──────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install frontend deps & build
        working-directory: gui/frontend
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
          VITE_APP_COMMIT: ${{ steps.ver.outputs.commit }}
          VITE_BUILD_TIMESTAMP: ${{ steps.ver.outputs.built_at }}
          VITE_BUILD_VERIFICATION_REPORT_SHA256: ${{ steps.ver.outputs.verification_sha256 }}
          VITE_BUILD_VERIFICATION_RUN_URL: ${{ steps.ver.outputs.verification_run_url }}
        run: |
          npm ci
          npm run build

      - name: Install locked release environment from wheels
        run: |
          uv sync --locked --managed-python --python '3.11.15' --extra app --group release --no-dev --no-install-project --no-build --no-cache
          uv sync --locked --managed-python --python '3.11.15' --extra app --group release --no-dev --no-cache

      - name: Record and validate release dependencies
        run: uv run --no-sync python tools/check_locked_environment.py --expected-target '${{ matrix.target }}' --require-pyinstaller --output '${{ steps.ver.outputs.manifest }}'

      # ── PyInstaller ────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: uv run --no-sync pyinstaller perdura.spec

      # ── Archive ────────────────────────────────────────────────────
      - name: Archive Linux application
        run: ${{ matrix.archive_cmd }} ${{ steps.ver.outputs.archive }} -C dist Perdura

      - name: Build release-specific CycloneDX and SPDX SBOMs
        run: >-
          uv run --no-sync python tools/build_release_sbom.py
          --environment '${{ steps.ver.outputs.manifest }}'
          --package-lock gui/frontend/package-lock.json
          --subject '${{ steps.ver.outputs.archive }}'
          --version '${{ steps.ver.outputs.version }}'
          --commit '${{ steps.ver.outputs.commit }}'
          --created '${{ steps.ver.outputs.built_at }}'
          --cyclonedx-output '${{ steps.ver.outputs.cyclonedx }}'
          --spdx-output '${{ steps.ver.outputs.spdx }}'

      # ── Upload build artifact ──────────────────────────────────────
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.ver.outputs.archive }}
            ${{ steps.ver.outputs.manifest }}
            ${{ steps.ver.outputs.cyclonedx }}
            ${{ steps.ver.outputs.spdx }}
          retention-days: 5

  wheel:
    needs: [test, crow-assurance]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download consolidated CI verification report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-CI-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ci-evidence

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.29'
          enable-cache: false

      - name: Install uv-managed Python 3.11.15
        run: uv python install 3.11.15

      - name: Resolve and stamp version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then REF="$DISPATCH_TAG"; else REF="$REF_NAME"; fi
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable vX.Y.Z form; got: $REF" >&2
            exit 1
          fi
          VERSION="${REF#v}"
          uv run --no-project --managed-python --python 3.11.15 python tools/check_version_consistency.py --expected "$VERSION"
          BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          VERIFY_SHA="$(python -c 'import hashlib, pathlib; print(hashlib.sha256(pathlib.Path("ci-evidence/verification-report.json").read_bytes()).hexdigest())')"
          VERIFY_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python tools/stamp_build.py --commit '${{ github.sha }}' --timestamp "$BUILD_TIMESTAMP" --verification-report-sha256 "$VERIFY_SHA" --verification-run-url "$VERIFY_URL"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built_at=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "verification_sha256=$VERIFY_SHA" >> "$GITHUB_OUTPUT"
          echo "verification_run_url=$VERIFY_URL" >> "$GITHUB_OUTPUT"
          echo "wheel=perdura-${VERSION}-py3-none-any.whl" >> "$GITHUB_OUTPUT"
          echo "constraints=Perdura-${VERSION}-application-constraints.txt" >> "$GITHUB_OUTPUT"
          echo "manifest=Perdura-${VERSION}-dependencies-python-wheel.json" >> "$GITHUB_OUTPUT"
          echo "cyclonedx=Perdura-${VERSION}-sbom-python-wheel.cdx.json" >> "$GITHUB_OUTPUT"
          echo "spdx=Perdura-${VERSION}-sbom-python-wheel.spdx.json" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Build release-stamped frontend
        working-directory: gui/frontend
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ steps.ver.outputs.built_at }}
          VITE_BUILD_VERIFICATION_REPORT_SHA256: ${{ steps.ver.outputs.verification_sha256 }}
          VITE_BUILD_VERIFICATION_RUN_URL: ${{ steps.ver.outputs.verification_run_url }}
        run: |
          npm ci
          npm run build

      - name: Install locked application runtime from wheels
        run: |
          uv sync --locked --managed-python --python '3.11.15' --extra app --no-dev --no-install-project --no-build --no-cache
          uv sync --locked --managed-python --python '3.11.15' --extra app --no-dev --no-cache

      - name: Build lock-derived application wheel
        run: >-
          uv run --no-sync python tools/build_pypi_wheel.py
          --output-dir wheelhouse
          --constraints-output '${{ steps.ver.outputs.constraints }}'

      - name: Record wheel runtime and validate packaged application
        shell: bash
        run: |
          uv run --no-sync python tools/check_locked_environment.py --expected-target linux-x64 --output '${{ steps.ver.outputs.manifest }}'
          export UV_TOOL_DIR="$PWD/.release-perdura-tools"
          export UV_TOOL_BIN_DIR="$PWD/.release-perdura-bin"
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          uv tool install --python 3.11.15 --force "wheelhouse/${{ steps.ver.outputs.wheel }}[app]"
          perdura --version
          perdura doctor --json > wheel-doctor.json

      - name: Build wheel-specific CycloneDX and SPDX SBOMs
        run: >-
          uv run --no-sync python tools/build_release_sbom.py
          --environment '${{ steps.ver.outputs.manifest }}'
          --package-lock gui/frontend/package-lock.json
          --subject 'wheelhouse/${{ steps.ver.outputs.wheel }}'
          --version '${{ steps.ver.outputs.version }}'
          --commit '${{ github.sha }}'
          --created '${{ steps.ver.outputs.built_at }}'
          --cyclonedx-output '${{ steps.ver.outputs.cyclonedx }}'
          --spdx-output '${{ steps.ver.outputs.spdx }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Perdura-python-wheel-${{ steps.ver.outputs.version }}
          path: |
            wheelhouse/${{ steps.ver.outputs.wheel }}
            ${{ steps.ver.outputs.constraints }}
            ${{ steps.ver.outputs.manifest }}
            ${{ steps.ver.outputs.cyclonedx }}
            ${{ steps.ver.outputs.spdx }}
            wheel-doctor.json
          retention-days: 5

  container:
    needs: [test, crow-assurance]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download consolidated CI verification report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-CI-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ci-evidence

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then REF="$DISPATCH_TAG"; else REF="$REF_NAME"; fi
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "verification_sha256=$(sha256sum ci-evidence/verification-report.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "verification_run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push native container image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIMESTAMP=${{ steps.version.outputs.built_at }}
            APP_VERIFICATION_REPORT_SHA256=${{ steps.version.outputs.verification_sha256 }}
            APP_VERIFICATION_RUN_URL=${{ steps.version.outputs.verification_run_url }}
          labels: |
            org.opencontainers.image.title=Perdura
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  container-manifest:
    needs: container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then REF="$DISPATCH_TAG"; else REF="$REF_NAME"; fi
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "series=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Publish multi-architecture manifest
        id: manifest
        shell: bash
        run: |
          IMAGE='ghcr.io/${{ github.repository }}'
          VERSION='${{ steps.version.outputs.version }}'
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:${{ steps.version.outputs.series }}" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          RAW="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --raw)"
          DIGEST="sha256:$(printf '%s' "$RAW" | sha256sum | cut -d' ' -f1)"
          mkdir -p container-release
          jq -n --arg image "$IMAGE" --arg version "$VERSION" --arg digest "$DIGEST" \
            --arg commit '${{ github.sha }}' \
            '{schema:"perdura.container-release/v1",image:$image,version:$version,digest:$digest,platforms:["linux/amd64","linux/arm64"],commit:$commit}' \
            > "container-release/Perdura-$VERSION-container.json"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest container provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Require anonymous access to the release image
        shell: bash
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect \
            'ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Perdura-container-${{ steps.version.outputs.version }}
          path: container-release/Perdura-${{ steps.version.outputs.version }}-container.json
          retention-days: 90

  release-evidence:
    needs: [test, crow-assurance, build, wheel, container-manifest]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then REF="$DISPATCH_TAG"; else REF="$REF_NAME"; fi
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable vX.Y.Z form; got: $REF" >&2
            exit 1
          fi
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Download Linux build evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-linux-${{ steps.version.outputs.version }}
          path: release-input

      - name: Download Python wheel evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-python-wheel-${{ steps.version.outputs.version }}
          path: release-input

      - name: Download container evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-container-${{ steps.version.outputs.version }}
          path: release-input

      - name: Download release scientific assurance
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-Crow-AMSAA-validation-${{ steps.version.outputs.version }}
          path: release-input

      - name: Download consolidated CI evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-CI-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ci-evidence

      - name: Assemble release verification evidence
        shell: bash
        run: |
          SUBJECT_ARGS=()
          while IFS= read -r path; do
            SUBJECT_ARGS+=(--subject "$path")
          done < <(find release-input -type f \( -name 'Perdura-*' -o -name 'perdura-*.whl' \) -print | sort)
          python tools/build_verification_evidence.py release \
            --ci-report ci-evidence/verification-report.json \
            --output release-evidence \
            --archive Perdura-${{ steps.version.outputs.version }}-verification-evidence.zip \
            --repository '${{ github.repository }}' --commit '${{ github.sha }}' \
            --version '${{ steps.version.outputs.version }}' \
            --run-id '${{ github.run_id }}' \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            "${SUBJECT_ARGS[@]}"

      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Perdura-verification-evidence-${{ steps.version.outputs.version }}
          path: |
            Perdura-${{ steps.version.outputs.version }}-verification-evidence.zip
            Perdura-${{ steps.version.outputs.version }}-verification-evidence.zip.sha256
            release-evidence/Perdura-${{ steps.version.outputs.version }}-release-verification.html
            release-evidence/Perdura-${{ steps.version.outputs.version }}-release-verification.json
          retention-days: 90

  pypi-publish:
    name: Publish Python application to PyPI
    needs: [wheel, release-evidence]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/perdura/${{ needs.wheel.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified application wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-python-wheel-${{ needs.wheel.outputs.version }}
          path: wheel-input

      - name: Isolate the public wheel
        shell: bash
        run: |
          mkdir -p dist
          find wheel-input -type f -name 'perdura-*.whl' -exec cp '{}' dist/ \;
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  release:
    needs: [build, wheel, container-manifest, release-evidence, pypi-publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Determine tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable vX.Y.Z form; got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download Linux release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-linux-${{ steps.tag.outputs.version }}
          path: .

      - name: Download Python application files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-python-wheel-${{ steps.tag.outputs.version }}
          path: .

      - name: Stage Python wheel for release
        shell: bash
        run: |
          mapfile -t wheels < <(find wheelhouse -maxdepth 1 -type f -name 'perdura-*.whl' -print)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one release wheel under wheelhouse; found ${#wheels[@]}." >&2
            exit 1
          fi
          cp "${wheels[0]}" .

      - name: Download container release identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-container-${{ steps.tag.outputs.version }}
          path: .

      - name: Download Crow-AMSAA release assurance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-Crow-AMSAA-validation-${{ steps.tag.outputs.version }}
          path: .

      - name: Download release verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Perdura-verification-evidence-${{ steps.tag.outputs.version }}
          path: .

      - name: Attest released binaries and verification evidence
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            Perdura-*-linux-x64.tar.gz
            perdura-*.whl
            Perdura-*-application-constraints.txt
            Perdura-*-container.json
            Perdura-*-dependencies-*.json
            Perdura-*-sbom-*.cdx.json
            Perdura-*-sbom-*.spdx.json
            Perdura-*-crow-amsaa-validation.json
            Perdura-*-verification-evidence.zip

      - name: Attach Linux SBOM attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: Perdura-${{ steps.tag.outputs.version }}-linux-x64.tar.gz
          sbom-path: Perdura-${{ steps.tag.outputs.version }}-sbom-linux-x64.spdx.json

      - name: Attach Python wheel SBOM attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: perdura-${{ steps.tag.outputs.version }}-py3-none-any.whl
          sbom-path: Perdura-${{ steps.tag.outputs.version }}-sbom-python-wheel.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Perdura ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            Supported delivery paths for this release:

            - Cross-platform local app: `uv tool install --python 3.11.15 'perdura[app]==${{ steps.tag.outputs.version }}'`
            - Linux x86-64 standalone archive: attached below
            - Multi-architecture container: `ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}` (`linux/amd64`, `linux/arm64`)

            Direct unsigned macOS and Windows executables are intentionally not published. The Python application is the supported local installation on those systems.
          files: |
            Perdura-*-linux-x64.tar.gz
            perdura-*.whl
            Perdura-*-application-constraints.txt
            Perdura-*-container.json
            Perdura-*-dependencies-linux-x64.json
            Perdura-*-dependencies-python-wheel.json
            Perdura-*-sbom-*.cdx.json
            Perdura-*-sbom-*.spdx.json
            Perdura-*-crow-amsaa-validation.json
            Perdura-*-verification-evidence.zip
            Perdura-*-verification-evidence.zip.sha256
            release-evidence/Perdura-*-release-verification.html
            release-evidence/Perdura-*-release-verification.json
