name: Sync companion website resources

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  eligibility:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      current: ${{ steps.source.outputs.current }}
    steps:
      - name: Check whether this source build is current
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          CURRENT_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$SOURCE_COMMIT" = "$CURRENT_COMMIT" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer main commit supersedes this resource bundle. Waiting for its CI run.'
            {
              printf '%s\n\n' '## Website screenshot publication'
              printf '%s\n\n' '**Superseded source build.** This run did not update the website PR; a newer main commit must complete CI.'
              printf 'Source commit: `%s`\n' "$SOURCE_COMMIT"
              printf '[Source CI run](%s)\n' "$SOURCE_RUN_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  sync:
    needs: eligibility
    if: needs.eligibility.outputs.current == 'true'
    runs-on: ubuntu-24.04
    # Stale completions must be rejected before they can replace a pending sync.
    concurrency:
      group: perdura-website-resources
      cancel-in-progress: false
    steps:
      - name: Recheck the source after waiting for synchronization
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$SOURCE_COMMIT" = "$CURRENT_COMMIT" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer main commit supersedes this resource bundle. Waiting for its CI run.'
          fi

      - name: Check website GitHub App configuration
        if: steps.source.outputs.current == 'true'
        id: configured
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.PERDURA_WEBSITE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PERDURA_WEBSITE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::error::Website synchronization cannot run. Configure PERDURA_WEBSITE_APP_CLIENT_ID and PERDURA_WEBSITE_APP_PRIVATE_KEY.'
            exit 1
          fi

      - name: Download the validated resource bundle
        if: steps.configured.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_NAME: Perdura-website-resources-${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name "$RESOURCE_NAME" --dir generated-resources

      - name: Check out the trusted main verifier
        if: steps.configured.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # workflow_run payloads identify data to verify, never executable code.
          ref: refs/heads/main
          persist-credentials: false
          path: source

      - name: Verify bundle source, inventory, and image hashes
        if: steps.configured.outputs.enabled == 'true'
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python source/tools/verify_website_resources.py generated-resources --source-commit "$SOURCE_COMMIT"

      - name: Create a repository-scoped GitHub App token
        if: steps.configured.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PERDURA_WEBSITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PERDURA_WEBSITE_APP_PRIVATE_KEY }}
          owner: djtroyal
          repositories: perdura-website
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the companion website
        if: steps.configured.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: djtroyal/perdura-website
          token: ${{ steps.app-token.outputs.token }}
          path: website

      - name: Replace generated resources and metadata
        if: steps.configured.outputs.enabled == 'true'
        shell: bash
        run: |
          find website/public/screenshots -maxdepth 1 -type f -name '*.png' -delete
          cp generated-resources/screenshots/*.png website/public/screenshots/
          cp generated-resources/screenshots.generated.json website/src/data/screenshots.generated.json
          mkdir -p website/public/website-resources
          cp generated-resources/build-provenance.json website/public/website-resources/
          cp generated-resources/diff-report.json website/public/website-resources/
          cp generated-resources/SHA256SUMS website/public/website-resources/

      - name: Validate the companion website build
        if: steps.configured.outputs.enabled == 'true'
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Recheck the source before updating the website PR
        id: publication
        if: steps.configured.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$SOURCE_COMMIT" = "$CURRENT_COMMIT" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer main commit supersedes this resource bundle. The website PR was not updated.'
          fi

      - name: Open or update the rolling website-resource pull request
        id: resource-pr
        if: steps.configured.outputs.enabled == 'true' && steps.publication.outputs.current == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: website
          branch: automation/perdura-screenshots
          delete-branch: true
          commit-message: 'chore: sync Perdura product screenshots'
          title: 'chore: sync generated Perdura product screenshots'
          body: |
            Automated, deterministic product resources generated by Perdura CI.

            Source commit: `${{ github.event.workflow_run.head_sha }}`
            Source workflow: ${{ github.event.workflow_run.html_url }}

            The bundle includes per-image SHA-256 hashes, build provenance,
            an inventory manifest, and an informative visual-difference report.

            Publication is pending: merge this PR and confirm the website's
            production deployment. A successful synchronization run only
            prepares this PR; it does not publish these screenshots.
          labels: automated,product-screenshots
          base: main

      - name: Report screenshot publication status
        if: always()
        env:
          SOURCE_CURRENT: ${{ steps.publication.outputs.current || steps.source.outputs.current }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_URL: ${{ steps.resource-pr.outputs.pull-request-url }}
          SYNC_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ["## Website screenshot publication", ""]
          if os.environ['SYNC_STATUS'] != 'success':
              lines.append('**Synchronization failed.** Review the failed step before publishing screenshots.')
          elif os.environ['SOURCE_CURRENT'] != 'true':
              lines.append('**Superseded source build.** This run did not update the website PR; a newer main commit must complete CI.')
          elif os.environ['PR_URL']:
              lines.append(f"**Publication pending merge and deployment:** [Review the website PR]({os.environ['PR_URL']}).")
          else:
              lines.append('**No resource changes to propose.** Website main already contains this generated bundle.')
          lines.extend(['', f"Source commit: `{os.environ['SOURCE_COMMIT']}`", f"[Source CI run]({os.environ['SOURCE_RUN_URL']})"])
          provenance = Path('generated-resources/build-provenance.json')
          if provenance.exists():
              try:
                  data = json.loads(provenance.read_text())
                  lines.extend([f"Generated: {data['generatedAt']}", f"Screenshots: {data['captures']}"])
              except (OSError, ValueError, TypeError, KeyError):
                  lines.append('Bundle provenance could not be read; consult the verification step.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
