version: 2

updates:
  # Review image digest refreshes alongside the vulnerability scan. Python and
  # uv version changes must also update the exact versions in pyproject/CI.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # These tags are qualified together with .python-version, the universal
    # lock and release workflows. Continue digest refreshes; migrate versions
    # in a coordinated PR instead of generating guaranteed policy failures.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: astral-sh/uv
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]

  - package-ecosystem: npm
    directory: /gui/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-core:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - major
          - minor
          - patch
      minor-patch:
        patterns:
          - '*'
        exclude-patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Update exact resolved versions without converting API lower bounds into
    # rolling latest-version floors.
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    groups:
      scientific-stack:
        patterns: [numpy, scipy, matplotlib, pandas, scikit-learn]
        update-types:
          - minor
          - patch
      onnx-stack:
        patterns: [onnx, onnxruntime, skl2onnx]
        update-types:
          - minor
          - patch
      application-stack:
        patterns: [fastapi, uvicorn, pydantic, pyinstaller, setuptools]
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
