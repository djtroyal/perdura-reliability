[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perdura"
version = "0.8.1"
description = "Perdura reliability engineering and statistics suite"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
# Source-install lower bounds describe APIs required by Perdura. Release
# binaries resolve and bundle a current dependency set; the project does not
# promise support for every historical combination at these lower bounds.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pandas>=2.2.2",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.5",
    "scikit-learn>=1.5",
    # Safe, portable fitted-model export and bounded local inference. Perdura
    # does not load pickle/joblib artifacts.
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "skl2onnx>=1.17",
]

[dependency-groups]
dev = ["asv>=0.6.6", "pytest>=7.4", "pytest-cov"]
release = ["pyinstaller>=6.21"]

[tool.uv]
required-version = "==0.11.29"
# Editable/source builds are the only builds allowed in release preparation;
# pin their PEP 517 backend instead of resolving a future setuptools release.
build-constraint-dependencies = ["setuptools==83.0.0"]
# This is the complete environment matrix exercised by CI and used for
# desktop/container releases. Entries are intentionally disjoint.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version == '3.13'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.13'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version == '3.13'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.13'",
]

[tool.setuptools]
packages = ["reliability", "perdura_app", "perdura_app.backend", "perdura_app.backend.routers"]
include-package-data = true

[tool.setuptools.package-dir]
reliability = "src/reliability"
perdura_app = "src/perdura_app"
"perdura_app.backend" = "gui/backend"
"perdura_app.backend.routers" = "gui/backend/routers"

[tool.setuptools.package-data]
perdura_app = ["static/*", "static/assets/*", "static/website-showcase/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit2"
junit_duration_report = "total"

[tool.coverage.run]
branch = true
source = ["src/reliability", "gui/backend"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
